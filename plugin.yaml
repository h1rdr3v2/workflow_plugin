name: workflow
version: 0.1.4
description: >-
  Persistent workflow engine for Hermes cron agents. Adds stateful execution,
  human-in-the-loop pause/resume, and cross-run memory without modifying
  Hermes core. Agents remember previous runs, pause for approvals, and
  resume with full context.

author: Destiny Ezenwata

provides_tools:
  - workflow_save_state
  - workflow_load_state
  - workflow_wait_for_user
  - workflow_submit_response
  - workflow_list_pending

provides_hooks:
  - pre_llm_call
